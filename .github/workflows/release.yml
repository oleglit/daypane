name: Release plugin
on:
  push:
    branches: ['russian-dashboard']
    tags: ['v*']
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/package_release.py
      - name: Upload installable plugin package
        if: startsWith(github.ref, 'refs/heads/')
        uses: actions/upload-artifact@v4
        with:
          name: DayPane-Kindle-plugin-0.4.1
          path: |
            dist/*.zip
            dist/SHA256SUMS
          retention-days: 30
      - name: Publish versioned package
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS --prerelease --title "DayPane $GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md
